{{- if .Values.tls.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app-template.fullname" . }}-stunnel-conf
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
data:
  stunnel.conf: |
    foreground = yes
    pid =
    [https]
    accept = 443
    connect = 127.0.0.1:{{ if .Values.oauth2Proxy.enabled }}4180{{ else }}{{ .Values.targetPort }}{{ end }}
    cert = /certs/tls/tls.crt
    key = /certs/tls/tls.key
    {{- if .Values.database.enabled }}
    [postgres]
    client = yes
    protocol = pgsql
    accept = 127.0.0.1:{{ .Values.database.port | default 5432 }}
    connect = {{ .Values.database.host | default (printf "%s-%s-data-rw.pgedge.svc:5432" (.Values.database.appName | default "main") (.Values.cluster.name | default "k")) }}
    verifyChain = yes
    CAfile = /certs/cas/ca-bundle.crt
    cert = /certs/db-client/tls.crt
    key = /certs/db-client/tls.key
    {{- end }}
    {{- if .Values.redis.enabled }}
    [redis]
    client = yes
    accept = 127.0.0.1:{{ .Values.redis.port | default 6379 }}
    connect = {{ .Values.redis.host | default "keydb-restricted-keydb-helm.keydb.svc.cluster.local:6380" }}
    verifyChain = yes
    CAfile = /certs/cas/ca-bundle.crt
    cert = /certs/keydb-client/tls.crt
    key = /certs/keydb-client/tls.key
    {{- end }}
{{- end }}
