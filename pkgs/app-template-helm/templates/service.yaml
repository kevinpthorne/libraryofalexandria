apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-template.fullname" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.service.public }}
    {{- if .Values.service.anycast }}
    p2p-anycast.io/expose: "true"
    {{- else }}
    external-dns.loa.internal/expose: "public"
    {{- end }}
    {{- end }}
    {{- if .Values.service.domains }}
    external-dns.alpha.kubernetes.io/hostname: {{ join "," .Values.service.domains | quote }}
    {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: {{ if eq (int (.Values.service.port | default 443)) 443 }}https{{ else }}http{{ end }}
      port: {{ .Values.service.port | default 443 }}
      targetPort: {{ if .Values.tls.enabled }}443{{ else }}{{ .Values.targetPort }}{{ end }}
      protocol: TCP
    {{- range .Values.service.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "app-template.selectorLabels" . | nindent 4 }}
