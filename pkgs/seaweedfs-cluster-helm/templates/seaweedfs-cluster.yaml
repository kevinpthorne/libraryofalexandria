apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed-cluster
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tls:
    enabled: true
    issuerRef:
      name: app-pki-bootstrap-issuer
      kind: ClusterIssuer
  image: {{ .Values.image | quote }}
  volume:
    replicas: {{ .Values.volumeReplicas }}
    {{- if gt (int .Values.volumeReplicas) 1 }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - seaweedfs
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - volume
              topologyKey: kubernetes.io/hostname
    {{- end }}
    extraArgs:
      {{- toYaml .Values.volumeExtraArgs | nindent 6 }}
    storageClassName: {{ .Values.storageClass | quote }}
    requests:
      storage: {{ .Values.size | quote }}
    volumes:
      - name: trusted-ca
        configMap:
          name: trusted-ca-bundle
    volumeMounts:
      - name: trusted-ca
        mountPath: /certs/cas
        readOnly: true
    env:
      - name: SSL_CERT_FILE
        value: "/certs/cas/ca-bundle.crt"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
  filer:
    replicas: {{ .Values.filerReplicas }}
    {{- if gt (int .Values.filerReplicas) 1 }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - seaweedfs
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - filer
              topologyKey: kubernetes.io/hostname
    {{- end }}
    persistence:
      enabled: true
      storageClassName: {{ .Values.storageClass | quote }}
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: "10Gi"
    volumes:
      - name: trusted-ca
        configMap:
          name: trusted-ca-bundle
    volumeMounts:
      - name: trusted-ca
        mountPath: /certs/cas
        readOnly: true
    env:
      - name: SSL_CERT_FILE
        value: "/certs/cas/ca-bundle.crt"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
  master:
    replicas: {{ .Values.masterReplicas }}
    {{- if gt (int .Values.masterReplicas) 1 }}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - seaweedfs
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - master
              topologyKey: kubernetes.io/hostname
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    {{- end }}
    extraArgs:
      - "-defaultReplication={{ .Values.replication }}"
    volumes:
      - name: trusted-ca
        configMap:
          name: trusted-ca-bundle
    volumeMounts:
      - name: trusted-ca
        mountPath: /certs/cas
        readOnly: true
    env:
      - name: SSL_CERT_FILE
        value: "/certs/cas/ca-bundle.crt"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
  s3:
    replicas: {{ .Values.s3Replicas }}
    extraArgs:
      - "-cert.file=/certs/s3/tls.crt"
      - "-key.file=/certs/s3/tls.key"
      - "-port.https=8334"
    volumes:
      - name: trusted-ca
        configMap:
          name: trusted-ca-bundle
      - name: s3-tls
        secret:
          secretName: seaweed-cluster-server-tls
    volumeMounts:
      - name: trusted-ca
        mountPath: /certs/cas
        readOnly: true
      - name: s3-tls
        mountPath: /certs/s3
        readOnly: true
    env:
      - name: SSL_CERT_FILE
        value: "/certs/cas/ca-bundle.crt"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
