{{- if and .Values.apiKey.generate (not .Values.apiKey.existingSecret) }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "llm-proxy.fullname" . }}-apikey-gen
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
spec:
  length: {{ .Values.apiKey.length | default 32 }}
  digits: {{ .Values.apiKey.digits | default 10 }}
  symbols: {{ .Values.apiKey.symbols | default 0 }}
  allowRepeat: {{ .Values.apiKey.allowRepeat | default true }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "llm-proxy.apiKeySecretName" . }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ include "llm-proxy.apiKeySecretName" . }}
    template:
      engineVersion: v2
      data:
        {{ .Values.apiKey.secretKey | default "api-key" }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "llm-proxy.fullname" . }}-apikey-gen
{{- end }}
