apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "allstarlink.fullname" . }}
  labels:
    {{- include "allstarlink.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "allstarlink.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "allstarlink.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/sbin/asterisk", "-f", "-vvv"]
          ports:
            - name: https
              containerPort: {{ .Values.service.httpsPort }}
              protocol: TCP
            - name: iax
              containerPort: {{ .Values.service.iaxPort }}
              protocol: UDP
            - name: sip
              containerPort: {{ .Values.service.sipPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/asterisk/asterisk.conf
              subPath: asterisk.conf
            - name: config
              mountPath: /etc/asterisk/modules.conf
              subPath: modules.conf
            - name: config
              mountPath: /etc/asterisk/rpt.conf
              subPath: rpt.conf
            - name: config
              mountPath: /etc/asterisk/iax.conf
              subPath: iax.conf
            - name: config
              mountPath: /etc/asterisk/http.conf
              subPath: http.conf
            - name: config
              mountPath: /etc/asterisk/pjsip.conf
              subPath: pjsip.conf
            - name: config
              mountPath: /etc/asterisk/extensions.conf
              subPath: extensions.conf
            - name: var-run
              mountPath: /var/run/asterisk
            - name: var-spool
              mountPath: /var/spool/asterisk
            - name: var-log
              mountPath: /var/log/asterisk
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/asterisk/certs
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/lib/asterisk
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "allstarlink.fullname" . }}-config
        - name: var-run
          emptyDir: {}
        - name: var-spool
          emptyDir: {}
        - name: var-log
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "allstarlink.fullname" . }}-pvc
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
