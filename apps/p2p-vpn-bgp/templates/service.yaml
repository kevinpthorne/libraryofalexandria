{{- if .Values.p2pVpn.isBootstrapPeer }}
apiVersion: v1
kind: Service
metadata:
  name: p2p-vpn-p2p
  labels:
    app: p2p-vpn
spec:
  type: LoadBalancer
  selector:
    app: p2p-vpn
  ports:
    - name: p2p-tcp
      port: {{ .Values.p2pVpn.p2pPort }}
      targetPort: p2p-tcp
      protocol: TCP
    - name: p2p-udp
      port: {{ .Values.p2pVpn.p2pPort }}
      targetPort: p2p-udp
      protocol: UDP
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-vpn-web
  labels:
    app: p2p-vpn
spec:
  type: ClusterIP
  selector:
    app: p2p-vpn
  ports:
    - name: https
      port: 443
      targetPort: gui
      protocol: TCP
    {{- if eq (include "p2p-vpn-bgp.metricsEnabled" .) "true" }}
    - name: metrics
      port: 9342
      targetPort: metrics
      protocol: TCP
    {{- end }}
