{{- $cluster := .Values.cluster | default dict -}}
{{- $hasFederation := hasKey ($cluster.apps | default dict) "loa-federation" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: asterisk-config
  labels:
    app: asterisk
data:
  pjsip.conf: |
    ; --- 1. THE TRANSPORT ---
    [global]
    type=global
    endpoint_identifier_order=username,ip,anonymous

    ; This tells Asterisk to listen on port 5060 inside its pod.
    [transport-udp]
    type=transport
    protocol=udp
    bind=0.0.0.0:{{ .Values.asterisk.ports.sip }}

    ; --- 2. THE TRUSTED KAMAILIO TRUNK ---
    ; We define Kamailio as an "endpoint" so Asterisk can process its calls.
    [kamailio-trunk]
    type=endpoint
    transport=transport-udp
    context=from-kamailio       ; The dialplan routing context for incoming calls
    disallow=all
    allow=g722,ulaw,alaw        ; Allow wideband G.722 first, fallback to G.711
    aors=kamailio-trunk
    ; Disable authentication because Kamailio is inside our secure K8s network
    outbound_auth=
    force_rport=yes
    rewrite_contact=yes

    [kamailio-trunk]
    type=aor
    contact=sip:{{ .Release.Name }}-kamailio-sip.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kamailio.ports.sip }}

    ; --- 3. IP IDENTIFICATION (THE SECURITY GATE) ---
    ; This is the most critical part. It tells Asterisk: "If a SIP packet comes 
    ; from this IP range, automatically assign it to the 'kamailio-trunk' endpoint."
    [kamailio-identify]
    type=identify
    endpoint=kamailio-trunk
    ; You must whitelist the IP range of your Kubernetes Pod network (e.g., Calico/Cilium)
    ; so Asterisk trusts the internal traffic routed by Kamailio.
    ; Cilium Network Policies should do heavier lifting here too
    match=10.0.0.0/8 

{{- if not $hasFederation }}
    ; --- 4. A TEST DESK PHONE (Fallback when loa-federation is not installed) ---
    ; If you want a physical desk phone to register through Kamailio to Asterisk
    [1001]
    type=endpoint
    context=from-kamailio
    disallow=all
    allow=ulaw
    auth=1001-auth
    aors=1001
    rewrite_contact=yes
    force_rport=yes

    [1001-auth]
    type=auth
    auth_type=userpass
    password=SuperSecretPassword123
    username=1001

    [1001]
    type=aor
    max_contacts=2
{{- end }}

    {{- if .Values.pjsip }}
    {{- .Values.pjsip | nindent 4 }}
    {{- end }}
  extensions.conf: |
    ; extensions.conf
    [general]
    static=yes
    writeprotect=yes

    ; This matches the context=from-kamailio we defined in pjsip.conf
    [from-kamailio]

    ; --- THE ECHO TEST ---
    ; Dialing 4444 will echo your voice back to you. 
    ; If you hear yourself, Kamailio, RTPEngine, and Asterisk are perfectly aligned.
    exten => 4444,1,NoOp(Incoming call from Kamailio - Echo Test)
    same => n,Answer()
    same => n,Echo()
    same => n,Hangup()

    ; --- THE RING TONE TEST ---
    ; Dialing 5555 plays a standard ringing tone.
    ; This tests one-way audio from K8s to your phone without needing sound files.
    exten => 5555,1,NoOp(Incoming call from Kamailio - PlayTones Test)
    same => n,Answer()
    same => n,PlayTones(ring)
    same => n,Wait(30)
    same => n,Hangup()

    {{- if .Values.extensions }}
    {{- .Values.extensions | nindent 4 -}}
    {{- end }}
  confbridge.conf: |
    {{- if .Values.confbridge }}
    {{- .Values.confbridge | nindent 4 -}}
    {{- end }}
{{- if $hasFederation }}
  sorcery.conf: |
    [res_pjsip]
    endpoint=realtime,ps_endpoints
    auth=realtime,ps_auths
    aor=realtime,ps_aors

  extconfig.conf: |
    [global]
    ps_endpoints => odbc,keycloak,ps_endpoints
    ps_auths => odbc,keycloak,ps_auths
    ps_aors => odbc,keycloak,ps_aors

  res_odbc.conf: |
    [keycloak]
    enabled => yes
    dsn => keycloak
    pre-connect => yes
    username => asterisk
    sanity_check => select 1

  odbc.ini: |
    [keycloak]
    Description = Keycloak PostgreSQL Database for PJSIP Realtime
    Driver = PostgreSQL
    Servername = 127.0.0.1
    Port = 5432
    Database = keycloak
    UserName = asterisk
    ReadOnly = Yes

  odbcinst.ini: |
    [PostgreSQL]
    Description = PostgreSQL ODBC driver
    Driver = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
    Setup = /usr/lib/x86_64-linux-gnu/odbc/libodbcpsqlS.so
    Driver64 = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
    Setup64 = /usr/lib/x86_64-linux-gnu/odbc/libodbcpsqlS.so
    FileUsage = 1

  stunnel.conf: |
    foreground = yes
    pid =
    [postgres]
    client = yes
    protocol = pgsql
    accept = 127.0.0.1:5432
    connect = {{ if .Values.pgedge }}{{ .Values.pgedge.appName | default "main" }}{{ else }}pgedge{{ end }}-{{ $cluster.name | default "k" }}-data-rw.pgedge.svc:5432
    verifyChain = yes
    CAfile = /certs/cas/ca-bundle.crt
    cert = /certs/db-client/tls.crt
    key = /certs/db-client/tls.key
{{- end }}