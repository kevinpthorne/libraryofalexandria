{{- $cluster := .Values.cluster | default dict -}}
{{- $hasFederation := hasKey ($cluster.apps | default dict) "loa-federation" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-asterisk
spec:
  serviceName: {{ .Release.Name }}-asterisk
  replicas: {{ .Values.asterisk.replicaCount }}
  selector:
    matchLabels:
      app: asterisk
  template:
    metadata:
      labels:
        app: asterisk
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/asterisk/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: init-asterisk-lib
          image: {{ .Values.asterisk.image }}
          command: 
            - sh
            - -c
            - |
              cp -R /var/lib/asterisk/* /mnt/asterisk-lib/ 2>/dev/null || true
              {{- if $hasFederation }}
              cp /mnt/db-client-certs/* /certs/db-client/
              chmod 400 /certs/db-client/tls.key
              {{- end }}
          volumeMounts:
            - name: asterisk-lib
              mountPath: /mnt/asterisk-lib
            {{- if $hasFederation }}
            - name: db-client-certs-secret
              mountPath: /mnt/db-client-certs
            - name: db-client-certs
              mountPath: /certs/db-client
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: asterisk
          image: {{ .Values.asterisk.image }}
          {{- if $hasFederation }}
          command: ["sh", "-c", "sleep 2 && exec /usr/sbin/asterisk -f -vvvddd"]
          {{- else }}
          command: ["/usr/sbin/asterisk", "-f", "-vvvddd"]
          {{- end }}
          ports:
            - name: sip-internal
              containerPort: {{ .Values.asterisk.ports.sip }}
              protocol: UDP
          volumeMounts:
            - name: asterisk-config-volume
              mountPath: /etc/asterisk/pjsip.conf
              subPath: pjsip.conf
            - name: asterisk-config-volume
              mountPath: /etc/asterisk/extensions.conf
              subPath: extensions.conf
            - name: asterisk-config-volume
              mountPath: /etc/asterisk/confbridge.conf
              subPath: confbridge.conf
            {{- if $hasFederation }}
            - name: asterisk-config-volume
              mountPath: /etc/asterisk/sorcery.conf
              subPath: sorcery.conf
            - name: asterisk-config-volume
              mountPath: /etc/asterisk/extconfig.conf
              subPath: extconfig.conf
            - name: asterisk-config-volume
              mountPath: /etc/asterisk/res_odbc.conf
              subPath: res_odbc.conf
            - name: asterisk-config-volume
              mountPath: /etc/odbc.ini
              subPath: odbc.ini
            - name: asterisk-config-volume
              mountPath: /etc/odbcinst.ini
              subPath: odbcinst.ini
            - name: cas
              mountPath: /certs/cas
              readOnly: true
            - name: db-client-certs
              mountPath: /certs/db-client
              readOnly: true
            {{- end }}
            - name: asterisk-run
              mountPath: /var/run/asterisk
            - name: asterisk-spool
              mountPath: /var/spool/asterisk
            - name: asterisk-log
              mountPath: /var/log/asterisk
            - name: asterisk-lib
              mountPath: /var/lib/asterisk
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: asterisk-config-volume
          configMap:
            name: asterisk-config
        - name: asterisk-run
          emptyDir: {}
        - name: asterisk-spool
          emptyDir: {}
        - name: asterisk-log
          emptyDir: {}
        - name: asterisk-lib
          emptyDir: {}
        {{- if $hasFederation }}
        - name: cas
          configMap:
            name: trusted-ca-bundle
        - name: db-client-certs-secret
          secret:
            secretName: pgedge-asterisk-client-cert
            defaultMode: 256
        - name: db-client-certs
          emptyDir: {}
        {{- end }}

{{- if $hasFederation }}
---
apiVersion: db.loa.kevinpthorne.com/v1alpha1
kind: PrivateDatabase
metadata:
  name: asterisk
  namespace: {{ .Release.Namespace }}
spec:
  databaseName: asterisk
  userName: asterisk
  appNamespace: {{ .Release.Namespace }}
  federate: false
{{- end }}