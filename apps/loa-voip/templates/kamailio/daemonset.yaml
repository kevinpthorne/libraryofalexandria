apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kamailio
  labels:
    app: kamailio
spec:
  selector:
    matchLabels:
      app: kamailio
  template:
    metadata:
      labels:
        app: kamailio
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/kamailio/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: generate-config
          image: {{ .Values.kamailio.image }}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: kamailio-template-volume
              mountPath: /etc/kamailio-template
            - name: kamailio-generated-config
              mountPath: /etc/kamailio-gen
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s/RTPENGINE_IP_PLACEHOLDER/${NODE_IP}/g" -e "s/POD_IP_PLACEHOLDER/${POD_IP}/g" /etc/kamailio-template/kamailio.cfg > /etc/kamailio-gen/kamailio.cfg
              cp /etc/kamailio-template/tls.cfg /etc/kamailio-gen/tls.cfg
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: kamailio
          image: {{ .Values.kamailio.image }}
          ports:
            - name: sip-udp
              containerPort: {{ .Values.kamailio.ports.sip }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ .Values.kamailio.ports.sip }}
              protocol: TCP
            - name: ws-tcp
              containerPort: {{ .Values.kamailio.ports.ws }}
              protocol: TCP
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: kamailio-generated-config
              mountPath: /etc/kamailio/kamailio.cfg
              subPath: kamailio.cfg
            - name: kamailio-generated-config
              mountPath: /etc/kamailio/tls.cfg
              subPath: tls.cfg
            - name: kamailio-tls-volume
              mountPath: /etc/kamailio/tls
              readOnly: true
            - name: kamailio-run
              mountPath: /run/kamailio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: kamailio-template-volume
          configMap:
            name: kamailio-config
        - name: kamailio-generated-config
          emptyDir: {}
        - name: kamailio-tls-volume
          secret:
            secretName: {{ .Release.Name }}-kamailio-tls
        - name: kamailio-run
          emptyDir: {}