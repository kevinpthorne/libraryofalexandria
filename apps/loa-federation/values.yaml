argoNamespace: argo-cd
cluster: {}

pki:
  rootCAIssuer: app-pki-bootstrap-issuer  # currently implied to be ClusterIssuer
  certManagerNamespace: cert-manager

pgedge:
  instances: 1
  appName: main
  namespace: pgedge
  # PostgreSQL 17.11, Spock 5.0.13, pgvector 0.8.7; amd64 + arm64.
  # Keep extension binaries consistent across nodes and reboots.
  imageName: ghcr.io/pgedge/pgedge-postgres:17-spock5-standard@sha256:6d2fb528a11a059d07247e38b38e601a3795d1ab2bfd78ad945f9e77227c0a15
  storageSize: "50Gi"
  pjsipViewsJob:
    enabled: false

keydb:
  instances: 1
  namespace: keydb
  replBacklogSize: "200mb"

immich:
  namespace: immich

externaldns:
  namespace: federation-externaldns
  apiKeySecret: cf-key
  apiKeySecretKey: api-key

syncFolders:
  - path: /immich-library

syncBuckets:
  - bucketName: immich-data

cloudflared:
  namespace: federation-cloudflared
  tunnelKeySecret: cf-key
  tunnelKeySecretKey: api-key
  tunnelId: "32cab819-2ee5-4055-8c19-d56a7115b00c"
  domains:
    - "immich.kpt.link"
    - "ident.kpt.link"

anycast:
  gatewayDomain: "gateway.kpt.link"