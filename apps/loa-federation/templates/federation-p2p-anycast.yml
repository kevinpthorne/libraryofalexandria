apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: federation-p2p-anycast
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: 'https://github.com/kevinpthorne/p2p-anycast.git'
    path: deploy/helm/anycast-origin
    targetRevision: 0.7.0
    helm:
      releaseName: federation-p2p-anycast
      valuesObject:
        image:
          repository: ghcr.io/kevinpthorne/anycast-origin
        existingSecret: "p2p-anycast-secrets"
        publicValues:
          caPub: {{ (lookup "v1" "Secret" "kube-system" "p2p-anycast-secrets" | default (lookup "v1" "Secret" .Release.Namespace "p2p-anycast-secrets") | dig "data" "ca.pub" "" | b64dec) | quote }}
          manifestBase64: {{ (lookup "v1" "Secret" "kube-system" "p2p-anycast-secrets" | default (lookup "v1" "Secret" .Release.Namespace "p2p-anycast-secrets") | dig "data" "origin_manifest.pb" "" | b64dec) | quote }}
        identity:
          pvc:
            enabled: true
        config:
          edge_multiaddrs:
            - "/dns4/one.oc.kpt.link/udp/4003/quic-v1/p2p/Qmd3GpKPfKAeq4ppr82ypW7psuknbHNEkdHM2T7hzn8NJE"
            - "/dns4/two.oc.kpt.link/udp/4003/quic-v1/p2p/Qmenk2L1wWG5HPmXAP5ndcerwXXDh9gD8oF8cJePFnz6h9"
            - "/dns4/three.oc.kpt.link/udp/4003/quic-v1/p2p/QmX1xGoRbKm6zrcWP3NUxZwR3nese1pF1Bxq2GyA3pMwtn"
        k8sDiscovery:
          enabled: true
          defaultGatewayTarget: "cilium-gateway-local-gateway.kube-system.svc.cluster.local:443"
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
