apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: federation-gateways
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/gateway-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        endpoints:
          - name: cloudflare-gateway
            namespace: public-gateway
            annotations:
              external-dns.alpha.kubernetes.io/target: "{{ .Values.cloudflared.tunnelId }}.cfargotunnel.com"
            hostnames:
              - "*.kpt.link"
            ports:
              - port: 443
                protocol: TLS
                tls:
                  mode: Passthrough
          - name: anycast-gateway
            namespace: public-gateway
            annotations:
              external-dns.alpha.kubernetes.io/target: "{{ .Values.anycast.gatewayDomain }}"
            hostnames:
              - "*.kpt.link"
            ports:
              - port: 443
                protocol: TLS
                tls:
                  mode: Passthrough
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: public-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # pull from internet
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"