apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sipcord.fullname" . }}
  labels:
    {{- include "sipcord.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: sipcord
      {{- include "sipcord.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: sipcord
        {{- include "sipcord.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sipcord
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sipcord.fullname" . }}-secret
                  key: DISCORD_BOT_TOKEN
            - name: DIALPLAN_PATH
              value: "/app/dialplan.toml"
            - name: SIP_PORT
              value: {{ .Values.config.sipPort | quote }}
            - name: RTP_PORT_START
              value: {{ .Values.config.rtpPortStart | quote }}
            - name: RTP_PORT_END
              value: {{ .Values.config.rtpPortEnd | quote }}
            {{- if .Values.config.sipPublicHost }}
            - name: SIP_PUBLIC_HOST
              value: {{ .Values.config.sipPublicHost | quote }}
            {{- end }}
          ports:
            - name: sip-udp
              containerPort: {{ .Values.config.sipPort }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ .Values.config.sipPort }}
              protocol: TCP
          volumeMounts:
            - name: dialplan-volume
              mountPath: /app/dialplan.toml
              subPath: dialplan.toml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dialplan-volume
          configMap:
            name: {{ include "sipcord.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
