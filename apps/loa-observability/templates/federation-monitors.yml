apiVersion: apps/v1
kind: Deployment
metadata:
  name: keydb-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: keydb-exporter
    app.kubernetes.io/instance: keydb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keydb-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keydb-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        fsGroup: 59000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: "redis://keydb-restricted-keydb-helm.keydb.svc.cluster.local:6379"
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: keydb-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: keydb-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
  selector:
    app.kubernetes.io/name: keydb-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keydb-exporter
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keydb-exporter
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pgedge-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - pgedge
  selector:
    matchLabels:
      cnpg.io/cluster: main-k-data
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: seaweedfs-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - seaweedfs-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - seaweedfs-filer-sync
          - seaweedfs
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
