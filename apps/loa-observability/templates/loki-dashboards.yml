{{- if .Values.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-dashboards-1
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  loki-chunks.json: |-
{{ .Files.Get "dashboards/loki-chunks.json" | indent 4 }}
  loki-deletion.json: |-
{{ .Files.Get "dashboards/loki-deletion.json" | indent 4 }}
  loki-logs.json: |-
{{ .Files.Get "dashboards/loki-logs.json" | indent 4 }}
  loki-mixin-recording-rules.json: |-
{{ .Files.Get "dashboards/loki-mixin-recording-rules.json" | indent 4 }}
  loki-operational.json: |-
{{ .Files.Get "dashboards/loki-operational.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-dashboards-2
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  loki-reads-resources.json: |-
{{ .Files.Get "dashboards/loki-reads-resources.json" | indent 4 }}
  loki-reads.json: |-
{{ .Files.Get "dashboards/loki-reads.json" | indent 4 }}
  loki-retention.json: |-
{{ .Files.Get "dashboards/loki-retention.json" | indent 4 }}
  loki-writes-resources.json: |-
{{ .Files.Get "dashboards/loki-writes-resources.json" | indent 4 }}
  loki-writes.json: |-
{{ .Files.Get "dashboards/loki-writes.json" | indent 4 }}
{{- end }}
