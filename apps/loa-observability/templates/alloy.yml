# 3. THE TELEMETRY COLLECTOR
{{- if .Values.alloy.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: alloy
    targetRevision: 1.x.x
    helm:
      values: |
        crds:
          create: false
        # Tolerate RKE2 Control Plane taints so Alloy runs on every node
        controller:
          tolerations:
            - effect: NoSchedule
              operator: Exists
            - effect: NoExecute
              operator: Exists
          volumes:
            extra:
              - name: trusted-ca-bundle
                configMap:
                  name: trusted-ca-bundle

        alloy:
          mounts:
            varlog: true
            extra:
              - name: trusted-ca-bundle
                mountPath: /etc/ssl/certs/trusted-ca-bundle.crt
                subPath: ca-bundle.crt
                readOnly: true

          # Enforce RuntimeDefault seccomp profile
          securityContext:
            seccompProfile:
              type: RuntimeDefault
              
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
              }
              {{- if .Values.loki.enabled }}
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  action = "keep"
                  regex = sys.env("K8S_NODE_NAME")
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  action = "replace"
                  target_label = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  action = "replace"
                  target_label = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "container"
                }
                rule {
                  action = "replace"
                  replacement = "{{ .Values.cluster.name | default "k" }}"
                  target_label = "cluster"
                }
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                    "__meta_kubernetes_pod_label_app",
                    "__meta_kubernetes_pod_container_name",
                  ]
                  regex = "^;*([^;]+)(;.*)?$"
                  action = "replace"
                  target_label = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  separator = "/"
                  action = "replace"
                  target_label = "job"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.local.receiver]
              }

              loki.write "local" {
                endpoint {
                  url = "https://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
                  tls_config {
                    ca_file = "/etc/ssl/certs/trusted-ca-bundle.crt"
                  }
                }
              }
              {{- end }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end}}