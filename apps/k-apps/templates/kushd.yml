apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kushd
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/kushd.git
    path: charts/kushd
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"
