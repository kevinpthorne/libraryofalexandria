{{- $cluster := .Values.cluster | default dict -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 3.2.1
    helm:
      valuesObject:
        controllers:
          vaultwarden:
            type: statefulset
            replicas: 1
            containers:
              main:
                image:
                  repository: ghcr.io/dani-garcia/vaultwarden
                  tag: 1.35.2
                env:
                  DOMAIN: "https://vaultwarden.{{ $cluster.name | default "k" }}.loa.internal"
                  TZ: "EDT"
                  ROCKET_TLS: '{certs="/certs/tls.crt",key="/certs/tls.key"}'
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                probes:
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /alive
                        port: 80
                        scheme: HTTPS
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /alive
                        port: 80
                        scheme: HTTPS
            pod:
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
        service:
          main:
            controller: vaultwarden
            ports:
              http:
                port: 80
        persistence:
          data:
            enabled: true
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 5Gi
            storageClass: "longhorn"
            globalMounts:
              - path: /data
          tls:
            enabled: true
            type: secret
            name: vaultwarden-tls
            globalMounts:
              - path: /certs
                readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden-tls
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/service-tls-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        svcName: "vaultwarden"
        cluster:
          name: {{ $cluster.name | default "k" }}
        cert:
          secretName: "vaultwarden-tls"
          sans:
            - "vaultwarden.{{ $cluster.name | default "k" }}.loa.internal"
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden-gateway
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/gateway-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        endpoints:
          - name: vaultwarden
            createGateway: false
            gatewayName: local-gateway
            gatewayNamespace: kube-system
            hostnames:
              - "vaultwarden.{{ $cluster.name | default "k" }}.loa.internal"
            ports:
              - port: 443
                protocol: TLS
                targetPort: 80
                targetService: vaultwarden
                tls:
                  mode: Passthrough
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
