{{- if (index .Values "monica" "enabled" | default true) -}}
{{- $cluster := .Values.cluster | default dict -}}
{{- $hasFederation := hasKey ($cluster.apps | default dict) "loa-federation" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monica
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/app-template-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        fullnameOverride: monica
        cluster:
          name: {{ $cluster.name | default "k" }}
        image:
          repository: monica
          tag: latest
        targetPort: 8080
        command:
          - /bin/bash
          - -c
        args:
          - |
            set -e
            source /etc/apache2/envvars
            mkdir -p /var/www/html/storage/app/public \
                     /var/www/html/storage/framework/cache \
                     /var/www/html/storage/framework/sessions \
                     /var/www/html/storage/framework/views \
                     /var/www/html/storage/logs
            php /var/www/html/artisan storage:link || true
            php /var/www/html/artisan migrate --force
            rm -f /var/run/apache2/apache2.pid
            exec apache2 -DFOREGROUND
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 33
          runAsGroup: 33
          fsGroup: 33
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 33
          runAsGroup: 33
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: APP_ENV
            value: "production"
          - name: APP_URL
            value: "https://monica.{{ $cluster.name | default "k" }}.kpt.link"
          {{- if $hasFederation }}
          - name: DB_CONNECTION
            value: "pgsql"
          - name: DB_HOST
            value: "127.0.0.1"
          - name: DB_PORT
            value: "5432"
          - name: DB_DATABASE
            value: "monica"
          - name: DB_USERNAME
            value: "monica"
          - name: DB_PASSWORD
            value: ""
          - name: CACHE_DRIVER
            value: "redis"
          - name: SESSION_DRIVER
            value: "redis"
          - name: QUEUE_CONNECTION
            value: "redis"
          - name: REDIS_HOST
            value: "127.0.0.1"
          - name: REDIS_PORT
            value: "6379"
          {{- end }}
        service:
          public: true
          domains:
            - "monica.{{ $cluster.name | default "k" }}.loa.internal"
            - "monica.{{ $cluster.name | default "k" }}.kpt.link"
        oauth2Proxy:
          enabled: {{ $hasFederation }}
          issuerUrl: "https://ident.{{ $cluster.name | default "k" }}.loa.internal/realms/loa"
        keycloak:
          enabled: {{ $hasFederation }}
        database:
          enabled: {{ $hasFederation }}
          createPrivateDatabase: {{ $hasFederation }}
          databaseName: monica
          userName: monica
        redis:
          enabled: {{ $hasFederation }}
          createKeydbClient: {{ $hasFederation }}
          appName: monica
        persistence:
          data:
            enabled: true
            type: pvc
            mountPath: /var/www/html/storage
            subPath: data
            size: 10Gi
            storageClass: "longhorn"
        extraConfigMaps:
          - name: monica-apache-conf
            data:
              ports.conf: |
                Listen 8080
              000-default.conf: |
                <VirtualHost *:8080>
                    ServerAdmin webmaster@localhost
                    DocumentRoot /var/www/html/public

                    <Directory /var/www/html/public>
                        Options Indexes FollowSymLinks
                        AllowOverride All
                        Require all granted
                    </Directory>

                    ErrorLog /dev/stderr
                    CustomLog /dev/stdout combined
                </VirtualHost>
        extraVolumes:
          - name: monica-apache-conf
            configMap:
              name: monica-apache-conf
          - name: apache-run
            emptyDir: {}
          - name: apache-lock
            emptyDir: {}
        extraVolumeMounts:
          - name: monica-apache-conf
            mountPath: /etc/apache2/ports.conf
            subPath: ports.conf
          - name: monica-apache-conf
            mountPath: /etc/apache2/sites-enabled/000-default.conf
            subPath: 000-default.conf
          - name: apache-run
            mountPath: /var/run/apache2
          - name: apache-lock
            mountPath: /var/lock/apache2
  destination:
    server: https://kubernetes.default.svc
    namespace: monica
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"
{{- end }}
