apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loa-voip
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: apps/loa-voip
    targetRevision: HEAD
    helm:
      valuesObject:
        cluster:
          {{- .Values.cluster | toYaml | nindent 10 }}
        global:
          domain: "voip.{{ if and .Values.cluster .Values.cluster.name }}{{ .Values.cluster.name }}{{ else }}k{{ end }}.loa.internal"
        {{- if (index .Values "sipcord" "enabled") }}
        pjsip: |
          [sipcord-trunk]
          type=endpoint
          transport=transport-udp
          context=from-sipcord
          disallow=all
          allow=g722,ulaw,alaw
          aors=sipcord-trunk
          outbound_auth=sipcord-auth
          force_rport=yes
          rewrite_contact=yes
          rtp_timeout=10
          rtp_keepalive=5

          [sipcord-auth]
          type=auth
          auth_type=userpass
          username=asterisk
          password=sipcord

          [sipcord-trunk]
          type=aor
          contact=sip:sipcord.voip.svc.cluster.local:5060
          qualify_frequency=0

          [sipcord-identify]
          type=identify
          endpoint=sipcord-trunk
          match=10.0.0.0/8
        extensions: |
          ; --- DISCORD CONFBRIDGE ROUTING ---
          exten => _60XX,1,NoOp(Bridging call to Discord ConfBridge ${EXTEN})
          same => n,Set(VOLUME(rx)=-3)
          same => n,Set(DENOISE(rx)=on)
          same => n,Originate(PJSIP/${EXTEN}@sipcord-trunk,exten,sipcord-out,${EXTEN},1,,a)
          same => n,GotoIf($["${ORIGINATE_STATUS}" != "SUCCESS"]?unavailable)
          same => n,ConfBridge(${EXTEN},default_bridge,default_user)
          same => n,Hangup()
          same => n(unavailable),NoOp(Sipcord bridge unavailable - playing congestion tone)
          same => n,PlayTones(congestion)
          same => n,Wait(5)
          same => n,Hangup()

          exten => 6000,1,NoOp(Discord Channel Selector IVR)
          same => n,Answer()
          same => n,Read(DISCORD_EXT,beep,4)
          same => n,Goto(from-kamailio,${DISCORD_EXT},1)

          [sipcord-out]
          exten => _X.,1,NoOp(Outgoing call to Sipcord ${EXTEN})
          same => n,ConfBridge(${EXTEN},default_bridge,bridge_user)
          same => n,Hangup()

          [from-sipcord]
          exten => _X.,1,NoOp(Incoming call from Sipcord to ConfBridge ${EXTEN})
          same => n,ConfBridge(${EXTEN},default_bridge,bridge_user)
          same => n,Hangup()
        confbridge: |
          [default_bridge]
          type=bridge
          sound_join=no
          sound_leave=no
          internal_sample_rate=48000

          [default_user]
          type=user
          admin=no
          marked=no
          startmuted=no
          end_marked=yes
          jitterbuffer=yes

          [bridge_user]
          type=user
          quiet=yes
          announce_user_count=no
          marked=yes
          jitterbuffer=yes
        {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: voip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loa-voip-tls
  namespace: {{ .Values.argoNamespace | default "argo-cd" }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/service-tls-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        svcName: "loa-voip"
        cluster:
          name: {{ if and .Values.cluster .Values.cluster.name }}{{ .Values.cluster.name }}{{ else }}k{{ end }}
        cert:
          secretName: "loa-voip-kamailio-tls"
          sans:
            - "voip.{{ if and .Values.cluster .Values.cluster.name }}{{ .Values.cluster.name }}{{ else }}k{{ end }}.loa.internal"
  destination:
    server: https://kubernetes.default.svc
    namespace: voip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true