{{- if ((.Values.shlink | default dict).enabled | default true) -}}
{{- $cluster := .Values.cluster | default dict -}}
{{- $hasFederation := hasKey ($cluster.apps | default dict) "loa-federation" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shlink
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/app-template-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        fullnameOverride: shlink
        cluster:
          name: {{ $cluster.name | default "k" }}
        image:
          repository: shlinkio/shlink
          tag: stable
        targetPort: 8082
        service:
          public: true
          domains:
            - "urls.{{ $cluster.name | default "k" }}.kpt.link"
        database:
          enabled: {{ $hasFederation }}
          createPrivateDatabase: {{ $hasFederation }}
          databaseName: shlink
          userName: shlink
        oauth2Proxy:
          enabled: {{ $hasFederation }}
          issuerUrl: "https://ident.kpt.link/realms/loa"
          upstream: "http://127.0.0.1:8080"
          extraArgs:
            - --skip-auth-route=GET=^/[a-zA-Z0-9_\.\-\~]+/?$
            - --skip-auth-route=GET=^/[a-zA-Z0-9_\.\-\~]+/qr-code/?$
            - --skip-auth-route=GET=^/robots\.txt$
            - --skip-auth-route=GET=^/favicon\.ico$
            - --skip-auth-route=GET=^/health$
            - --skip-auth-route=GET=^/assets/
        keycloak:
          enabled: {{ $hasFederation }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 20
        env:
          - name: PORT
            value: "8082"
          - name: DB_DRIVER
            value: "postgres"
          - name: DB_HOST
            value: "127.0.0.1"
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "urls"
          - name: DB_USER
            value: "urls"
          - name: DB_PASSWORD
            value: ""
          - name: DEFAULT_DOMAIN
            value: "urls.{{ $cluster.name | default "k" }}.kpt.link"
          - name: IS_HTTPS_ENABLED
            value: "true"
          {{- if $hasFederation }}
          - name: INITIAL_API_KEY
            valueFrom:
              secretKeyRef:
                name: urls-api-secret
                key: apiKey
          {{- else }}
          - name: INITIAL_API_KEY
            value: "urls-admin-api-key"
          {{- end }}
        extraContainers:
          - name: web-client
            image: shlinkio/shlink-web-client:stable
            imagePullPolicy: IfNotPresent
            ports:
              - name: http-ui
                containerPort: 8080
            volumeMounts:
              - name: web-client-conf
                mountPath: /etc/nginx/conf.d/default.conf
                subPath: default.conf
              - name: servers-json
                mountPath: /usr/share/nginx/html/servers.json
                subPath: servers.json
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 101
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
        extraVolumes:
          - name: web-client-conf
            configMap:
              name: urls-web-client-conf
          {{- if $hasFederation }}
          - name: servers-json
            secret:
              secretName: urls-api-secret
              items:
                - key: servers.json
                  path: servers.json
          {{- else }}
          - name: servers-json
            configMap:
              name: urls-servers-json
          {{- end }}
        extraConfigMaps:
          - name: urls-web-client-conf
            data:
              default.conf: |
                server {
                    listen 8080 default_server;
                    charset utf-8;
                    root /usr/share/nginx/html;
                    index index.html;

                    # Expire rules for static content
                    location ~* \.(?:manifest|appcache|html?|xml|json)$ {
                        expires -1;
                    }

                    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
                        expires 1M;
                        add_header Cache-Control "public";
                    }

                    # REST API -> forward to Shlink backend
                    location /rest/ {
                        proxy_pass http://127.0.0.1:8082;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_read_timeout 90s;
                    }

                    # Health check -> forward to Shlink backend
                    location = /health {
                        proxy_pass http://127.0.0.1:8082;
                        proxy_set_header Host $host;
                    }

                    # Web Client SPA routes -> index.html
                    location ~ ^/(manage-servers|server|settings) {
                        try_files $uri /index.html;
                    }

                    # Root -> index.html
                    location = / {
                        try_files /index.html =404;
                    }

                    # All other routes -> Short URL redirection via Shlink backend
                    location / {
                        proxy_pass http://127.0.0.1:8082;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_read_timeout 90s;
                    }
                }
          {{- if not $hasFederation }}
          - name: urls-servers-json
            data:
              servers.json: |
                [
                  {
                    "name": "urls.{{ $cluster.name | default "k" }}.kpt.link",
                    "url": "https://urls.{{ $cluster.name | default "k" }}.kpt.link",
                    "apiKey": "urls-admin-api-key"
                  }
                ]
          {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: urls
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"

{{- if $hasFederation }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: urls-api-password
  namespace: urls
spec:
  length: 32
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: urls-api-secret
  namespace: urls
spec:
  refreshInterval: "0"
  target:
    name: urls-api-secret
    template:
      engineVersion: v2
      data:
        apiKey: "{{ `{{ .password }}` }}"
        servers.json: |
          [
            {
              "name": "urls.{{ $cluster.name | default "k" }}.kpt.link",
              "url": "https://urls.{{ $cluster.name | default "k" }}.kpt.link",
              "apiKey": "{{ `{{ .password }}` }}"
            }
          ]
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: urls-api-password
{{- end }}
{{- end }}
