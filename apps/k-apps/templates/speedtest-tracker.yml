{{- $speedtestTracker := index .Values "speedtest-tracker" | default .Values.speedtestTracker | default dict -}}
{{- if ($speedtestTracker.enabled | default true) -}}
{{- $cluster := .Values.cluster | default dict -}}
{{- $hasFederation := hasKey ($cluster.apps | default dict) "loa-federation" -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: speedtest-tracker
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/app-template-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        fullnameOverride: speedtest-tracker
        cluster:
          name: {{ $cluster.name | default "k" }}
        image:
          repository: lscr.io/linuxserver/speedtest-tracker
          tag: latest
        targetPort: 80
        initContainers:
          - name: init-storage
            image: lscr.io/linuxserver/speedtest-tracker:latest
            command:
              - /bin/sh
              - -c
              - |
                mkdir -p /app/www/storage/framework/views \
                         /app/www/storage/framework/cache/data \
                         /app/www/storage/framework/sessions \
                         /app/www/storage/logs \
                         /app/www/bootstrap/cache \
                         /config/nginx/site-confs
                touch /config/database.sqlite
                cp /etc/speedtest-custom/default.conf /config/nginx/site-confs/default.conf
            volumeMounts:
              - name: data
                mountPath: /config
              - name: storage-volume
                mountPath: /app/www/storage
              - name: bootstrap-cache
                mountPath: /app/www/bootstrap/cache
              - name: custom-config
                mountPath: /etc/speedtest-custom
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
            value: "1"
          - name: DB_CONNECTION
            value: "sqlite"
          - name: DB_DATABASE
            value: "/config/database.sqlite"
          - name: APP_URL
            value: "https://speedtest-tracker.{{ $cluster.name | default "k" }}.kpt.link"
          {{- if $hasFederation }}
          - name: APP_KEY
            valueFrom:
              secretKeyRef:
                name: speedtest-tracker-app-key
                key: appKey
          {{- else }}
          - name: APP_KEY
            value: "base64:dGVzdGtleWZvcnNwZWVkdGVzdHRyYWNrZXIxMjM0NTY="
          {{- end }}
        service:
          public: false
          domains:
            - "speedtest-tracker.{{ $cluster.name | default "k" }}.loa.internal"
        persistence:
          data:
            enabled: true
            type: pvc
            mountPath: /config
            size: 10Gi
            storageClass: "longhorn"
        extraVolumes:
          - name: run-volume
            emptyDir: {}
          - name: storage-volume
            emptyDir: {}
          - name: bootstrap-cache
            emptyDir: {}
          - name: custom-config
            configMap:
              name: speedtest-tracker-custom-config
              defaultMode: 493
        extraVolumeMounts:
          - name: run-volume
            mountPath: /run
          - name: storage-volume
            mountPath: /app/www/storage
          - name: bootstrap-cache
            mountPath: /app/www/bootstrap/cache
          - name: custom-config
            mountPath: /usr/bin/s6-setuidgid
            subPath: s6-setuidgid
        extraConfigMaps:
          - name: speedtest-tracker-custom-config
            data:
              s6-setuidgid: |
                #!/bin/sh
                shift 1
                exec "$@"
              default.conf: |
                server {
                    listen 80 default_server;
                    listen [::]:80 default_server;
                    server_name _;
                    set $root /app/www/public;
                    if (!-d /app/www/public) {
                        set $root /config/www;
                    }
                    root $root;
                    index index.html index.htm index.php;
                    location / {
                        try_files $uri $uri/ /index.html /index.htm /index.php$is_args$args;
                    }
                    location ~ ^(.+\.php)(.*)$ {
                        fastcgi_split_path_info ^(.+\.php)(.*)$;
                        if (!-f $document_root$fastcgi_script_name) { return 404; }
                        fastcgi_pass 127.0.0.1:9000;
                        fastcgi_index index.php;
                        fastcgi_buffers 16 4k;
                        fastcgi_buffer_size 16k;
                        include /etc/nginx/fastcgi_params;
                    }
                    location ~ /\.ht {
                        deny all;
                    }
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: speedtest-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"

{{- if $hasFederation }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: speedtest-tracker-app-key
  namespace: speedtest-tracker
spec:
  length: 32
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-tracker-app-key
  namespace: speedtest-tracker
spec:
  refreshInterval: "0"
  target:
    name: speedtest-tracker-app-key
    template:
      engineVersion: v2
      data:
        appKey: "base64:{{ `{{ .password | b64enc }}` }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: speedtest-tracker-app-key
{{- end }}
{{- end }}
