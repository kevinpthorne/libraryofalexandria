apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sipcord
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: apps/sipcord
    targetRevision: HEAD
    helm:
      valuesObject:
        discordBotToken: {{ .Values.sipcord.discordBotToken | default "" | quote }}
        channels: {{ .Values.sipcord.channels | toYaml | nindent 10 }}
        sipPublicHost: "voip.{{ if and .Values.cluster .Values.cluster.name }}{{ .Values.cluster.name }}{{ else }}k{{ end }}.loa.internal"
  destination:
    server: https://kubernetes.default.svc
    namespace: voip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"
