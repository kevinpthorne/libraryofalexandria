apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: allstarlink
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: apps/allstarlink
    targetRevision: HEAD
    helm:
      valuesObject:
        resources: {}  # TODO add USB device
  destination:
    server: https://kubernetes.default.svc
    namespace: allstarlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: allstarlink-tls
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/service-tls-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        svcName: "allstarlink"
        cluster:
          name: {{ .Values.cluster.name | default "k" }}
        cert:
          secretName: "allstarlink-tls"
          sans:
            - "allstarlink.{{ .Values.cluster.name | default "k" }}.loa.internal"
  destination:
    server: https://kubernetes.default.svc
    namespace: allstarlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: allstarlink-gateway
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/gateway-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        endpoints:
          - name: allstarlink
            createGateway: false
            gatewayName: local-gateway
            gatewayNamespace: kube-system
            hostnames:
              - "allstarlink.{{ .Values.cluster.name | default "k" }}.loa.internal"
            ports:
              - port: 443
                protocol: TLS
                targetPort: 443
                targetService: allstarlink
  destination:
    server: https://kubernetes.default.svc
    namespace: allstarlink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
