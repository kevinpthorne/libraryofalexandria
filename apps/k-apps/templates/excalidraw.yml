{{- if (index .Values "excalidraw" "enabled" | default true) -}}
{{- $cluster := .Values.cluster | default dict -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: excalidraw
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/app-template-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        fullnameOverride: excalidraw
        cluster:
          name: {{ $cluster.name | default "k" }}
        image:
          repository: excalidraw/excalidraw
          tag: latest
        targetPort: 80
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          fsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
          seccompProfile:
            type: RuntimeDefault
        extraVolumes:
          - name: nginx-cache
            emptyDir: {}
          - name: nginx-run
            emptyDir: {}
        extraVolumeMounts:
          - name: nginx-cache
            mountPath: /var/cache/nginx
          - name: nginx-run
            mountPath: /var/run
        service:
          public: true
          domains:
            - "excalidraw.{{ $cluster.name | default "k" }}.loa.internal"
            - "excalidraw.{{ $cluster.name | default "k" }}.kpt.link"
  destination:
    server: https://kubernetes.default.svc
    namespace: excalidraw
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"
{{- end }}
