# DNS records for oc.kpt.link pointing to gateway.kpt.link
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oc-kptlink-dns
  namespace: externaldns
  annotations:
    external-dns.loa.internal/expose: "public"
spec:
  endpoints:
    - dnsName: one.oc.kpt.link
      recordType: CNAME
      targets:
        - "gateway.kpt.link"
    - dnsName: two.oc.kpt.link
      recordType: CNAME
      targets:
        - "gateway.kpt.link"
    - dnsName: three.oc.kpt.link
      recordType: CNAME
      targets:
        - "gateway.kpt.link"
