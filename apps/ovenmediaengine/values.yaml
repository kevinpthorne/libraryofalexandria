nameOverride: ""
fullnameOverride: ""

image:
  repository: airensoft/ovenmediaengine
  tag: latest
  pullPolicy: IfNotPresent

# Cluster-specific compatibility constraints are supplied by the parent application.
nodeSelector: {}

domain: catcher.k.kpt.link
internalDomain: catcher.k.loa.internal

appName: app

# Required publishing, dashboard, API, and SRT transport credentials.
auth:
  secretName: "ovenmediaengine-access"
  secretKey: "stream-key"
  dashboardUser: "admin"
  dashboardPasswordKey: "dashboard-password"
  apiTokenKey: "api-token"
  srtPassphraseKey: "srt-passphrase"
  autoGenerate: true
  signedPolicy:
    policyQueryKeyName: "policy"
    signatureQueryKeyName: "signature"

api:
  enabled: true
  port: 8081

rtmps:
  enabled: true
  port: 1936
  # Plain RTMP is used only by the TLS terminator within the pod.
  backendPort: 1935
  ertmp: true
  stunnelImage:
    repository: cgr.dev/chainguard/stunnel
    tag: latest
    pullPolicy: IfNotPresent

srt:
  enabled: true
  port: 8890
  playbackPort: 9998
  public: true

llhls:
  enabled: true
  port: 3333
  tlsPort: 3334
  public: true
  chunkDuration: "0.5"
  partHoldBack: "1.5"
  segmentDuration: 6
  segmentCount: 10

hls:
  enabled: true
  segmentDuration: 4
  segmentCount: 4

webrtc:
  enabled: true
  signallingPort: 3333
  signallingTlsPort: 3334
  icePortRangeStart: 10000
  icePortRangeEnd: 10003
  tcpIcePort: 10000
  turnPort: 3478
  public: true
  stunServer: "stun.ovenmediaengine.com:13478"

ui:
  enabled: true
  port: 8080
  servicePort: 8080
  image:
    repository: nginxinc/nginx-unprivileged
    tag: alpine
    pullPolicy: IfNotPresent
  authImage:
    repository: python
    tag: "3.13-alpine"
    pullPolicy: IfNotPresent
  tls:
    secretName: ovenmediaengine-dashboard-tls
    issuerName: app-pki-bootstrap-issuer
    issuerKind: ClusterIssuer
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources: {}

service:
  # Public encrypted media transports only.
  public:
    enabled: true
    type: LoadBalancer
  # Internal HTTPS dashboard and encrypted media transports only.
  internal:
    enabled: true
    type: LoadBalancer

tls:
  enabled: true
  secretName: ovenmediaengine-tls
  issuerName: letsencrypt-prod
  issuerKind: ClusterIssuer

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

extraEnv: []
resources: {}
