{{- if .Values.auth.autoGenerate }}
{{- $secretName := required "auth.secretName is required" .Values.auth.secretName -}}
{{- $keys := list .Values.auth.secretKey .Values.auth.dashboardPasswordKey .Values.auth.apiTokenKey .Values.auth.srtPassphraseKey -}}
{{- range $key := $keys }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secretName }}-{{ $key }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 32
  digits: 10
  symbols: 0
  allowRepeat: true
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "0"
  target:
    name: {{ $secretName }}
  dataFrom:
    {{- range $key := $keys }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secretName }}-{{ $key }}
      rewrite:
        - regexp:
            source: "^password$"
            target: {{ $key | quote }}
    {{- end }}
{{- end }}
