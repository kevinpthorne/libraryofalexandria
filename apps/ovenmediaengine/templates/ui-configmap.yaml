{{- if .Values.ui.enabled }}
{{- $appName := .Values.appName | default "app" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ovenmediaengine.fullname" . }}-ui
  labels:
    {{- include "ovenmediaengine.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen {{ .Values.ui.port | default 8080 }} ssl;
        server_name _;
        ssl_certificate /ui-certs/tls.crt;
        ssl_certificate_key /ui-certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        auth_request /_auth;
        auth_request_set $ome_authorization $upstream_http_x_ome_authorization;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Expires;
        proxy_hide_header X-OME-Authorization;

        location = /_auth {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:8082/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $http_host;
        }

        location = /ingest {
            client_max_body_size 4096;
            proxy_pass http://127.0.0.1:8082/ingest;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $http_host;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:{{ .Values.api.port | default 8081 }}/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $ome_authorization;
            proxy_read_timeout 15s;
        }

        location /llhls/ {
            proxy_pass http://127.0.0.1:{{ .Values.llhls.port | default 3333 }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>OvenMediaEngine Dashboard</title>
      <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js" integrity="sha384-xLhS5rbIdhv65H3GLX+caQgMSiEK/Hkw8Z6HITolgRxvXs0omcbeYD639tkJ2Wu6" crossorigin="anonymous"></script>
      <style>
        :root {
          --bg-main: #0b0f19;
          --bg-card: #151d30;
          --bg-card-hover: #1c2742;
          --border-color: #24304f;
          --text-main: #f3f4f6;
          --text-muted: #9ca3af;
          --accent-orange: #f97316;
          --accent-blue: #3b82f6;
          --accent-green: #10b981;
          --accent-amber: #f59e0b;
          --accent-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: var(--bg-main);
          color: var(--text-main);
          min-height: 100vh;
          padding: 24px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-bottom: 24px;
          border-bottom: 1px solid var(--border-color);
          margin-bottom: 24px;
          flex-wrap: wrap;
          gap: 16px;
        }
        .title-group { display: flex; align-items: center; gap: 14px; }
        .logo-badge {
          background: linear-gradient(135deg, var(--accent-orange), var(--accent-amber));
          color: white;
          padding: 8px 14px;
          border-radius: 8px;
          font-weight: 700;
          letter-spacing: 0.5px;
          font-size: 16px;
        }
        h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .server-domain { color: var(--text-muted); font-size: 13px; font-family: monospace; margin-top: 4px; }
        .controls { display: flex; align-items: center; gap: 12px; }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 10px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: 500;
          background: rgba(255, 255, 255, 0.08);
        }
        .badge-live { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-waiting { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
        .pulse-dot {
          width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-green);
          box-shadow: 0 0 8px var(--accent-green);
          animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        button, select, input[type="text"] {
          background: var(--bg-card);
          border: 1px solid var(--border-color);
          color: var(--text-main);
          padding: 8px 14px;
          border-radius: 6px;
          font-size: 13px;
          cursor: pointer;
          transition: all 0.2s;
        }
        button:hover { background: var(--bg-card-hover); border-color: var(--accent-blue); }
        button.primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        button.primary:hover { background: #2563eb; }
        button:disabled { opacity: 0.6; cursor: wait; }
        .ingest-form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
        .ingest-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-muted); }
        .ingest-status { margin-top: 14px; color: var(--text-muted); font-size: 13px; }
        .ingest-status.error { color: var(--accent-red); }
        #ingest-results .url-text { white-space: normal; overflow-wrap: anywhere; }
        button.danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: var(--accent-red); }
        button.danger:hover { background: var(--accent-red); color: #fff; }

        .stats-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
          margin-bottom: 28px;
        }
        .stat-card {
          background: var(--bg-card);
          border: 1px solid var(--border-color);
          border-radius: 10px;
          padding: 16px 20px;
        }
        .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #fff; }
        .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-family: monospace; }

        .section-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        }
        .section-title { font-size: 17px; font-weight: 600; }

        .stream-grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: 18px;
          margin-bottom: 32px;
        }
        .stream-card {
          background: var(--bg-card);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          padding: 22px;
          transition: border-color 0.2s;
        }
        .stream-card.live { border-color: rgba(16, 185, 129, 0.4); }
        .stream-card-top {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          margin-bottom: 14px;
          flex-wrap: wrap;
          gap: 10px;
        }
        .path-name { font-size: 18px; font-weight: 700; font-family: monospace; color: #60a5fa; }
        .stream-details {
          display: flex;
          gap: 20px;
          margin-bottom: 16px;
          font-size: 13px;
          color: var(--text-muted);
          flex-wrap: wrap;
        }
        .stream-details span strong { color: var(--text-main); }
        .tracks-info {
          background: rgba(0, 0, 0, 0.25);
          padding: 8px 12px;
          border-radius: 6px;
          font-size: 12px;
          font-family: monospace;
          margin-bottom: 18px;
          color: #cbd5e1;
          display: flex;
          gap: 14px;
          flex-wrap: wrap;
        }
        .url-box {
          background: rgba(0, 0, 0, 0.35);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 12px;
          margin-top: 10px;
        }
        .url-item {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 6px 0;
          font-size: 12px;
          font-family: monospace;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
          gap: 10px;
        }
        .url-item:last-child { border-bottom: none; }
        .url-tag { font-weight: 600; color: #93c5fd; min-width: 115px; }
        .url-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e2e8f0; }
        .btn-copy {
          padding: 3px 8px;
          font-size: 11px;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-copy:hover { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }

        .modal-backdrop {
          display: none;
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0, 0, 0, 0.85);
          backdrop-filter: blur(4px);
          z-index: 1000;
          justify-content: center;
          align-items: center;
          padding: 20px;
        }
        .modal-content {
          background: var(--bg-card);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          width: 100%;
          max-width: 900px;
          overflow: hidden;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 16px 20px;
          border-bottom: 1px solid var(--border-color);
        }
        .modal-body {
          padding: 20px;
          background: #000;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 400px;
        }
        video { width: 100%; max-height: 520px; border-radius: 6px; outline: none; }
        .toast {
          position: fixed;
          bottom: 24px;
          right: 24px;
          background: #10b981;
          color: white;
          padding: 12px 20px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
          box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
          transform: translateY(100px);
          opacity: 0;
          transition: all 0.3s ease;
          z-index: 2000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .empty-state {
          padding: 32px;
          text-align: center;
          color: var(--text-muted);
          background: var(--bg-card);
          border: 1px dashed var(--border-color);
          border-radius: 10px;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <header>
          <div class="title-group">
            <div class="logo-badge">OME</div>
            <div>
              <h1>OvenMediaEngine Dashboard <span id="conn-badge" class="badge badge-waiting">Connecting...</span></h1>
              <div class="server-domain">Dashboard: https://{{ .Values.internalDomain | default "catcher.k.loa.internal" }}:{{ .Values.ui.port | default 8080 }} &bull; Public: {{ .Values.domain | default "catcher.k.kpt.link" }}</div>
            </div>
          </div>
          <div class="controls">
            <span id="version-tag" class="badge">v---</span>
            <label style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
              <input type="checkbox" id="auto-refresh" checked> Auto-refresh
            </label>
            <select id="refresh-interval">
              <option value="2000">2s</option>
              <option value="5000" selected>5s</option>
              <option value="10000">10s</option>
            </select>
            <button class="primary" id="btn-manual-refresh">Refresh</button>
          </div>
        </header>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Active Streams</div>
            <div class="stat-value" id="stat-active-streams">0</div>
            <div class="stat-sub" id="stat-app-name">App: /{{ $appName }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Connections</div>
            <div class="stat-value" id="stat-total-connections">0</div>
            <div class="stat-sub" id="stat-conn-breakdown">WebRTC: 0 &bull; LLHLS: 0 &bull; SRT: 0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Throughput In / Out</div>
            <div class="stat-value" id="stat-throughput">0 bps</div>
            <div class="stat-sub" id="stat-throughput-out">Out: 0 bps</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Data In / Out</div>
            <div class="stat-value" id="stat-bytes-in">0 B</div>
            <div class="stat-sub" id="stat-bytes-out">Sent: 0 B</div>
          </div>
        </div>

        <div class="section-header">
          <div class="section-title">Live Streams</div>
        </div>
        <div id="streams-container" class="stream-grid">
          <div class="empty-state">Loading streams...</div>
        </div>

        <div class="section-header">
          <div class="section-title">Signed Ingest URLs</div>
        </div>
        <div class="stream-card" style="margin-bottom: 32px;">
          <form id="ingest-form" class="ingest-form">
            <label for="ingest-stream">Stream name
              <input id="ingest-stream" type="text" value="live" pattern="[A-Za-z0-9_-]{1,64}" maxlength="64" required autocomplete="off" spellcheck="false">
            </label>
            <label for="ingest-ttl">Valid for new connections
              <select id="ingest-ttl">
                <option value="0" selected>Never expires</option>
                <option value="1">1 hour</option>
                <option value="24">24 hours</option>
                <option value="168">7 days</option>
              </select>
            </label>
            <button id="ingest-generate" class="primary" type="submit">Generate signed URLs</button>
          </form>
          <p id="ingest-status" class="ingest-status" role="status" aria-live="polite">Generate URLs to authorize publishing. Treat generated URLs and stream keys as secrets.</p>
          <p class="ingest-status">Keys do not expire by default and survive rollouts. Rotating the signing secret revokes them. Optional timed URLs expire only for new connections.</p>
          <div id="ingest-results" hidden></div>
        </div>
      </div>

      <div id="preview-modal" class="modal-backdrop">
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="modal-stream-title" style="font-size: 16px; font-weight: 600;">Stream Preview</h3>
            <button id="modal-close" class="btn-copy">&times; Close</button>
          </div>
          <div class="modal-body">
            <video id="preview-video" controls autoplay muted playsinline></video>
          </div>
        </div>
      </div>

      <div id="toast" class="toast">URL copied to clipboard!</div>

      <script>
        const publicHost = {{ .Values.domain | default "catcher.k.kpt.link" | toJson }};
        const appName = {{ $appName | toJson }};
        const appPath = encodeURIComponent(appName);
        const tlsPort = {{ .Values.llhls.tlsPort | default 3334 | toJson }};

        let currentHls = null;

        function formatBytes(bytes) {
          if (!bytes || bytes === 0) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatBits(bits) {
          if (!bits || bits === 0) return '0 bps';
          const k = 1000;
          const sizes = ['bps', 'Kbps', 'Mbps', 'Gbps'];
          const i = Math.floor(Math.log(bits) / Math.log(k));
          return parseFloat((bits / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showToast(msg) {
          const toast = document.getElementById('toast');
          toast.textContent = msg;
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              showToast('Copied to clipboard');
              return;
            } catch {
              // Permissions may block the Clipboard API; try the user-initiated copy below.
            }
          }

          // Retain copying when the Clipboard API is unavailable or denied.
          const field = document.createElement('textarea');
          const focused = document.activeElement;
          field.value = text;
          field.readOnly = true;
          field.style.position = 'fixed';
          field.style.left = '-9999px';
          let copied = false;
          try {
            document.body.appendChild(field);
            field.select();
            field.setSelectionRange(0, text.length);
            copied = document.execCommand('copy');
          } catch {
            // Fall back to manual copying if the browser blocks both methods.
          } finally {
            field.remove();
            if (focused) focused.focus({ preventScroll: true });
          }
          if (copied) {
            showToast('Copied to clipboard');
          } else {
            prompt('Copy URL:', text);
          }
        }

        function textElement(tag, className, text) {
          const element = document.createElement(tag);
          element.className = className;
          element.textContent = text;
          return element;
        }

        function appendUrlRow(container, tag, value) {
          const row = document.createElement('div');
          row.className = 'url-item';
          const copy = textElement('button', 'btn-copy', 'Copy');
          copy.type = 'button';
          copy.addEventListener('click', () => copyText(value));
          row.append(textElement('span', 'url-tag', tag), textElement('span', 'url-text', value), copy);
          container.appendChild(row);
        }

        const ingestForm = document.getElementById('ingest-form');
        const ingestStream = document.getElementById('ingest-stream');
        const ingestTtl = document.getElementById('ingest-ttl');
        const ingestButton = document.getElementById('ingest-generate');
        const ingestStatus = document.getElementById('ingest-status');
        const ingestResults = document.getElementById('ingest-results');

        function clearIngestResults() {
          ingestResults.replaceChildren();
          ingestResults.hidden = true;
          ingestStatus.className = 'ingest-status';
          ingestStatus.textContent = 'Settings changed. Generate new signed URLs to use these settings.';
        }

        ingestStream.addEventListener('input', clearIngestResults);
        ingestTtl.addEventListener('change', clearIngestResults);
        ingestForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!ingestForm.reportValidity()) return;
          const request = { stream: ingestStream.value, ttlHours: Number(ingestTtl.value) };
          ingestResults.replaceChildren();
          ingestResults.hidden = true;
          ingestStatus.className = 'ingest-status';
          ingestStatus.textContent = 'Generating signed URLs…';
          ingestButton.disabled = ingestStream.disabled = ingestTtl.disabled = true;
          ingestButton.textContent = 'Generating…';
          try {
            const response = await fetch('/ingest', {
              method: 'POST',
              credentials: 'same-origin',
              cache: 'no-store',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(request)
            });
            if (!response.ok) throw new Error('Generation failed');
            const result = await response.json();
            if ((result.expiresAt !== null && !Number.isFinite(result.expiresAt)) ||
                !Array.isArray(result.items) || result.items.length === 0 ||
                !result.items.every(item => typeof item.tag === 'string' && typeof item.url === 'string')) {
              throw new Error('Invalid response');
            }
            for (const item of result.items) {
              const box = document.createElement('div');
              box.className = 'url-box';
              appendUrlRow(box, item.tag, item.url);
              if (typeof item.server === 'string' && typeof item.streamKey === 'string') {
                appendUrlRow(box, 'OBS Server', item.server);
                appendUrlRow(box, 'OBS Stream Key', item.streamKey);
              }
              ingestResults.appendChild(box);
            }
            ingestResults.hidden = false;
            ingestStatus.textContent = result.expiresAt === null
              ? 'No expiry. Save these keys; they remain valid until the signing secret is rotated.'
              : 'New connections allowed until ' + new Date(result.expiresAt).toLocaleString() + '.';
          } catch {
            ingestResults.replaceChildren();
            ingestStatus.className = 'ingest-status error';
            ingestStatus.textContent = 'Unable to generate signed URLs. Check your dashboard sign-in and try again.';
          } finally {
            ingestButton.disabled = ingestStream.disabled = ingestTtl.disabled = false;
            ingestButton.textContent = 'Generate signed URLs';
          }
        });

        async function fetchAPI(endpoint, options = {}) {
          try {
            const res = await fetch(endpoint, { ...options, credentials: 'same-origin', cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
          } catch (e) {
            console.error(`Error fetching ${endpoint}:`, e);
            return null;
          }
        }

        async function updateDashboard() {
          const [verRes, statsRes, streamsRes] = await Promise.all([
            fetchAPI('/v1/version'),
            fetchAPI(`/v1/stats/current/vhosts/default/apps/${appPath}`),
            fetchAPI(`/v1/vhosts/default/apps/${appPath}/streams`)
          ]);

          const connBadge = document.getElementById('conn-badge');
          const versionTag = document.getElementById('version-tag');

          if (verRes && verRes.response) {
            connBadge.className = 'badge badge-live';
            connBadge.innerHTML = '<span class="pulse-dot"></span> Online';
            versionTag.textContent = verRes.response.gitVersion || ('v' + verRes.response.version);
          } else {
            connBadge.className = 'badge badge-waiting';
            connBadge.textContent = 'Disconnected';
          }

          if (statsRes && statsRes.response) {
            const s = statsRes.response;
            const c = s.connections || {};
            document.getElementById('stat-total-connections').textContent = s.totalConnections || 0;
            document.getElementById('stat-conn-breakdown').textContent =
              `WebRTC: ${c.webrtc || 0} • LLHLS: ${c.llhls || 0} • HLS: ${c.hlsv3 || 0} • SRT: ${c.srt || 0}`;
            document.getElementById('stat-throughput').textContent = formatBits(s.lastThroughputIn || 0);
            document.getElementById('stat-throughput-out').textContent = 'Out: ' + formatBits(s.lastThroughputOut || 0);
            document.getElementById('stat-bytes-in').textContent = formatBytes(s.totalBytesIn || 0);
            document.getElementById('stat-bytes-out').textContent = 'Sent: ' + formatBytes(s.totalBytesOut || 0);
          }

          const streamNames = (streamsRes && Array.isArray(streamsRes.response)) ? streamsRes.response : [];
          document.getElementById('stat-active-streams').textContent = streamNames.length;

          const streamsContainer = document.getElementById('streams-container');
          if (streamNames.length === 0) {
            streamsContainer.innerHTML = '<div class="empty-state">No active streams right now. Generate signed URLs below to publish using RTMPS, encrypted SRT, or WHIP.</div>';
            return;
          }

          const streamDetails = await Promise.all(streamNames.map(async name => {
            const [info, st] = await Promise.all([
              fetchAPI(`/v1/vhosts/default/apps/${appPath}/streams/${encodeURIComponent(name)}`),
              fetchAPI(`/v1/stats/current/vhosts/default/apps/${appPath}/streams/${encodeURIComponent(name)}`)
            ]);
            return { name, info: info && info.response, stats: st && st.response };
          }));

          streamsContainer.innerHTML = '';
          streamDetails.forEach(({ name, info, stats }) => {
            const input = (info && info.input) || {};
            const sourceType = input.sourceType || 'Live';
            const remoteAddr = (input.connection && input.connection.remoteAddress)
              ? `${input.connection.remoteAddress}:${input.connection.remotePort || ''}`
              : (input.sourceUrl || 'Connected');

            let tracksDesc = 'Bypass / Passthrough';
            if (Array.isArray(input.tracks) && input.tracks.length > 0) {
              tracksDesc = input.tracks.map(t => {
                if (t.type === 'Video' && t.video) {
                  const fps = t.video.framerate ? Math.round(t.video.framerate) : '';
                  return `Video: ${t.video.codec || 'Video'} (${t.video.width}x${t.video.height}${fps ? ' @ ' + fps + 'fps' : ''})`;
                }
                if (t.type === 'Audio' && t.audio) {
                  return `Audio: ${t.audio.codec || 'Audio'} (${t.audio.samplerate || ''}Hz, ${t.audio.channel || ''}ch)`;
                }
                return t.type || 'Track';
              }).join(' • ');
            }

            const viewers = stats ? (stats.totalConnections || 0) : 0;
            const bytesIn = stats ? formatBytes(stats.totalBytesIn || 0) : '0 B';
            const bitrateIn = stats ? formatBits(stats.lastThroughputIn || 0) : '0 bps';

            const streamPath = `${appPath}/${encodeURIComponent(name)}`;
            const llhlsPublic = `https://${publicHost}:${tlsPort}/${streamPath}/master.m3u8`;
            const hlsPublic = `https://${publicHost}:${tlsPort}/${streamPath}/ts:playlist.m3u8`;
            const webrtcPlay = `wss://${publicHost}:${tlsPort}/${streamPath}`;

            const card = document.createElement('div');
            card.className = 'stream-card live';
            card.innerHTML = `
              <div class="stream-card-top">
                <div>
                  <span class="path-name"></span>
                  <span style="margin-left: 10px;" class="badge badge-live"><span class="pulse-dot"></span> Live</span>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="primary" data-action="preview">&#9658; Preview Stream</button>
                  <button class="danger" data-action="terminate">Terminate</button>
                </div>
              </div>
              <div class="stream-details">
                <span data-detail="source"></span>
                <span data-detail="viewers"></span>
                <span data-detail="bitrate"></span>
                <span data-detail="bytes"></span>
              </div>
              <div class="tracks-info"></div>
              <div class="url-box"></div>
            `;
            card.querySelector('.path-name').textContent = `/${appName}/${name}`;
            card.querySelector('[data-detail="source"]').textContent = `Source: ${sourceType} (${remoteAddr})`;
            card.querySelector('[data-detail="viewers"]').textContent = `Viewers: ${viewers}`;
            card.querySelector('[data-detail="bitrate"]').textContent = `Bitrate In: ${bitrateIn}`;
            card.querySelector('[data-detail="bytes"]').textContent = `Data In: ${bytesIn}`;
            card.querySelector('.tracks-info').textContent = tracksDesc;
            card.querySelector('[data-action="preview"]').addEventListener('click', () => openPreview(name));
            card.querySelector('[data-action="terminate"]').addEventListener('click', () => terminateStream(name));
            const urls = card.querySelector('.url-box');
            appendUrlRow(urls, 'LL-HLS (HTTPS)', llhlsPublic);
            appendUrlRow(urls, 'HLS (HTTPS)', hlsPublic);
            appendUrlRow(urls, 'WebRTC Play', webrtcPlay);
            streamsContainer.appendChild(card);
          });
        }

        async function terminateStream(name) {
          if (!confirm(`Terminate stream /${appName}/${name}?`)) return;
          const res = await fetchAPI(`/v1/vhosts/default/apps/${appPath}/streams/${encodeURIComponent(name)}`, { method: 'DELETE' });
          if (res) {
            showToast(`Terminated /${appName}/${name}`);
            updateDashboard();
          } else {
            showToast('Failed to terminate stream');
          }
        }

        function openPreview(name) {
          const modal = document.getElementById('preview-modal');
          const video = document.getElementById('preview-video');
          const title = document.getElementById('modal-stream-title');
          title.textContent = `Live Stream Preview: /${appName}/${name}`;
          // The configured playlist uses relative media URLs, preserving the /llhls/ proxy prefix.
          const streamUrl = `/llhls/${appPath}/${encodeURIComponent(name)}/master.m3u8`;

          if (Hls.isSupported()) {
            if (currentHls) currentHls.destroy();
            currentHls = new Hls({ enableWorker: true, lowLatencyMode: true });
            currentHls.loadSource(streamUrl);
            currentHls.attachMedia(video);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.play().catch(() => {});
          }
          modal.style.display = 'flex';
        }

        function closePreview() {
          const modal = document.getElementById('preview-modal');
          const video = document.getElementById('preview-video');
          modal.style.display = 'none';
          video.pause();
          if (currentHls) {
            currentHls.destroy();
            currentHls = null;
          }
          video.src = '';
        }

        document.getElementById('modal-close').addEventListener('click', closePreview);
        document.getElementById('preview-modal').addEventListener('click', (e) => {
          if (e.target.id === 'preview-modal') closePreview();
        });

        let timer = null;
        function scheduleRefresh() {
          if (timer) clearInterval(timer);
          const auto = document.getElementById('auto-refresh').checked;
          const interval = parseInt(document.getElementById('refresh-interval').value, 10);
          if (auto) timer = setInterval(updateDashboard, interval);
        }

        document.getElementById('auto-refresh').addEventListener('change', scheduleRefresh);
        document.getElementById('refresh-interval').addEventListener('change', scheduleRefresh);
        document.getElementById('btn-manual-refresh').addEventListener('click', () => {
          updateDashboard();
          showToast('Dashboard refreshed');
        });

        updateDashboard();
        scheduleRefresh();
      </script>
    </body>
    </html>
{{- end }}
