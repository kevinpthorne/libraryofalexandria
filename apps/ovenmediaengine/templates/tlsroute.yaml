{{- if and .Values.gateway.enabled .Values.service.public.enabled .Values.tls.enabled (or (and .Values.llhls.enabled .Values.llhls.public) (and .Values.webrtc.enabled .Values.webrtc.public)) }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "ovenmediaengine.fullname" . }}-stream-tls
  labels:
    {{- include "ovenmediaengine.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    p2p-anycast.io/expose: "true"
    p2p-anycast.io/policy: "STRICT_SINGLETON"
    p2p-anycast.io/public-port: {{ .Values.llhls.tlsPort | quote }}
    p2p-anycast.io/target: {{ printf "%s.%s.svc.cluster.local:%v" .Values.gateway.serviceName .Values.gateway.namespace .Values.gateway.port | quote }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "ovenmediaengine.fullname" . }}
          port: {{ .Values.llhls.tlsPort }}
{{- end }}
