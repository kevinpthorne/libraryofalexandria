apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mediamtx.fullname" . }}-config
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
data:
  mediamtx.yml: |
    # Protocols
    rtsp: no
    webrtc: no
    srt: no

    # RTMPS
    rtmp: yes
    rtmpAddress: :1935
    rtmpEncryption: {{ .Values.rtmps.encryption | default "optional" }}
    rtmpsAddress: :{{ .Values.rtmps.port | default 1936 }}
    rtmpServerCert: /certs/tls.crt
    rtmpServerKey: /certs/tls.key

    # HLS (Internal streaming for Jellyfin)
    {{- if .Values.hls.enabled }}
    hls: yes
    hlsAddress: :{{ .Values.hls.port | default 8888 }}
    hlsEncryption: no
    {{- else }}
    hls: no
    {{- end }}

    # Authentication
    authMethod: internal
    authInternalUsers:
      {{- if .Values.auth.secretName }}
      - user: {{ .Values.auth.defaultUser | default "publisher" }}
        pass: ""
        permissions:
          - action: publish
      - user: any
        permissions:
          - action: read
          - action: playback
      {{- else }}
      - user: any
        permissions:
          - action: publish
          - action: read
          - action: playback
      {{- end }}

    # Paths (Allow dynamic stream paths)
    paths:
      all_others:

