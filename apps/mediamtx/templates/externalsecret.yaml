{{- if and .Values.auth.secretName .Values.auth.autoGenerate }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.auth.secretName }}-gen
spec:
  length: 32
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.secretName }}
spec:
  refreshInterval: "0"
  target:
    name: {{ .Values.auth.secretName }}
    template:
      engineVersion: v2
      data:
        {{ .Values.auth.secretKey | default "stream-key" }}: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.auth.secretName }}-gen
{{- end }}
