apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediamtx.fullname" . }}
  labels:
    {{- include "mediamtx.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mediamtx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "mediamtx.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mediamtx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: rtmps
              containerPort: {{ .Values.rtmps.port | default 1936 }}
              protocol: TCP
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            {{- if .Values.hls.enabled }}
            - name: hls
              containerPort: {{ .Values.hls.port | default 8888 }}
              protocol: TCP
            {{- end }}
          {{- if or .Values.auth.secretName .Values.extraEnv }}
          env:
            {{- if .Values.auth.secretName }}
            - name: MTX_AUTHINTERNALUSERS_0_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: {{ .Values.auth.secretKey | default "stream-key" }}
            {{- if .Values.auth.userKey }}
            - name: MTX_AUTHINTERNALUSERS_0_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: {{ .Values.auth.userKey }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
            - name: tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "mediamtx.fullname" . }}-config
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | default "mediamtx-tls" }}
