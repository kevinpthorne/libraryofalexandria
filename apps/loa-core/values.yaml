argoNamespace: argo-cd
cluster: {}

seaweedfs:
  replication: "000"

hostdns:
  enabled: true

cloudflareExternaldns:
  enabled: true

seaweedfsUi:
  enabled: true
  chart: seaweedfs-ui
  repoURL: oci://ghcr.io/kevinpthorne/charts/seaweedfs-ui
  targetRevision: "0.1.0"
  namespace: seaweedfs-system
  syncWave: "2"
  image:
    repository: ghcr.io/kevinpthorne/seaweedfs-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    tls:
      enabled: true
      existingSecret: seaweed-cluster-server-tls
    discovery:
      kubernetes:
        enabled: true
        filerSyncPodSelector: "app=seaweedfs-filer-sync"
  extraValues: {}

publicGateway:
  enabled: true

acmeServer:
  enabled: true

wazuh:
  enabled: true
  namespace: wazuh
  chart: wazuh
  repoURL: https://morgoved.github.io/wazuh-helm/
  targetRevision: "2.5.1"
  storageClass: "longhorn"
  # Observability integration:
  # By default, reuse existing Loki + Grafana in loa-observability.
  # To deploy dedicated OpenSearch indexer and OpenSearch dashboard, set indexer.enabled=true and dashboard.enabled=true.
  indexer:
    enabled: false
    replicas: 1
    storageSize: 25Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  dashboard:
    enabled: false
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  master:
    storageSize: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  worker:
    replicas: 1
    storageSize: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  agent:
    enabled: true
    images:
      repository: kinseii/wazuh-agent
      tag: latest
  extraValues: {}