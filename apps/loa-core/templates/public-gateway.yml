{{- if .Values.publicGateway.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-gateway
  namespace: {{ .Values.argoNamespace }}
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    path: pkgs/gateway-helm
    targetRevision: HEAD
    helm:
      valuesObject:
        endpoints:
          - name: public-gateway
            namespace: public-gateway
            hostnames:
              - "*.{{ .Values.cluster.externalDomain }}"
            ports:
              - port: 443
                protocol: TLS
                tls:
                  mode: Passthrough
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: public-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # pull from internet
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"
{{- end }}