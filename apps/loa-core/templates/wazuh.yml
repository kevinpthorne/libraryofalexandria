{{- if ((.Values.wazuh | default dict).enabled | default true) }}
{{- $cluster := .Values.cluster | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh
  namespace: {{ .Values.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: {{ .Values.wazuh.chart }}
    repoURL: {{ .Values.wazuh.repoURL }}
    targetRevision: {{ .Values.wazuh.targetRevision | quote }}
    helm:
      releaseName: wazuh
      valuesObject:
        cert-manager:
          enabled: false
        certificates:
          enabled: true
        indexer:
          enabled: {{ .Values.wazuh.indexer.enabled | default false }}
          {{- if not .Values.wazuh.indexer.enabled }}
          cred:
            existingSecret: wazuh-api-cred
          {{- end }}
          replicas: {{ .Values.wazuh.indexer.replicas | default 1 }}
          storageClass: {{ .Values.wazuh.storageClass | default "longhorn" | quote }}
          storageSize: {{ .Values.wazuh.indexer.storageSize | default "25Gi" | quote }}
          sysctlImage:
            enabled: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          serviceAccount:
            automountServiceAccountToken: false
          networkPolicy:
            enabled: false
          {{- if .Values.wazuh.indexer.resources }}
          resources:
            {{- toYaml .Values.wazuh.indexer.resources | nindent 12 }}
          {{- end }}
        {{- if not .Values.wazuh.indexer.enabled }}
        externalIndexer:
          enabled: true
          host: "127.0.0.1"
          port: 9200
        {{- end }}
        wazuh:
          serviceAccount:
            automountServiceAccountToken: false
          agentGroupConf:
            - name: default
              agent: |
                <agent_config>
                  <localfile>
                    <location>journald</location>
                    <log_format>journald</log_format>
                  </localfile>
                  <localfile>
                    <location>/host/var/log/*.log</location>
                    <log_format>syslog</log_format>
                  </localfile>
                </agent_config>
          {{- if not .Values.wazuh.indexer.enabled }}
          filebeat:
            config: |
              filebeat.modules:
                - module: wazuh
                  alerts:
                    enabled: true
                  archives:
                    enabled: false
              output.console:
                codec.format:
                  string: '%{[message]}'
                pretty: false
              logging.metrics.enabled: false
              seccomp:
                default_action: allow
                syscalls:
                  - action: allow
                    names:
                      - rseq
          {{- end }}
          master:
            storageClass: {{ .Values.wazuh.storageClass | default "longhorn" | quote }}
            storageSize: {{ .Values.wazuh.master.storageSize | default "10Gi" | quote }}
            {{- if not .Values.wazuh.indexer.enabled }}
            extraConf: |
              <vulnerability-detection>
                <enabled>no</enabled>
                <index-status>no</index-status>
              </vulnerability-detection>
              <indexer>
                <enabled>no</enabled>
                <hosts>
                  <host>https://127.0.0.1:9200</host>
                </hosts>
              </indexer>
            {{- end }}
            readinessProbe:
              tcpSocket:
                port: 55000
              initialDelaySeconds: 20
              periodSeconds: 10
              failureThreshold: 12
            livenessProbe:
              tcpSocket:
                port: 55000
              initialDelaySeconds: 90
              periodSeconds: 15
              failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - KILL
                  - NET_BIND_SERVICE
                  - SETGID
                  - SETUID
                  - SYS_CHROOT
              seccompProfile:
                type: RuntimeDefault
            networkPolicy:
              enabled: false
            {{- if .Values.wazuh.master.resources }}
            resources:
              {{- toYaml .Values.wazuh.master.resources | nindent 14 }}
            {{- end }}
          worker:
            replicas: {{ .Values.wazuh.worker.replicas | default 1 }}
            storageClass: {{ .Values.wazuh.storageClass | default "longhorn" | quote }}
            storageSize: {{ .Values.wazuh.worker.storageSize | default "10Gi" | quote }}
            {{- if not .Values.wazuh.indexer.enabled }}
            extraConf: |
              <vulnerability-detection>
                <enabled>no</enabled>
                <index-status>no</index-status>
              </vulnerability-detection>
              <indexer>
                <enabled>no</enabled>
                <hosts>
                  <host>https://127.0.0.1:9200</host>
                </hosts>
              </indexer>
            {{- end }}
            readinessProbe:
              tcpSocket:
                port: 1514
              initialDelaySeconds: 20
              periodSeconds: 10
              failureThreshold: 12
            livenessProbe:
              tcpSocket:
                port: 1514
              initialDelaySeconds: 90
              periodSeconds: 15
              failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - KILL
                  - NET_BIND_SERVICE
                  - SETGID
                  - SETUID
                  - SYS_CHROOT
              seccompProfile:
                type: RuntimeDefault
            networkPolicy:
              enabled: false
            {{- if .Values.wazuh.worker.resources }}
            resources:
              {{- toYaml .Values.wazuh.worker.resources | nindent 14 }}
            {{- end }}
        dashboard:
          enabled: {{ .Values.wazuh.dashboard.enabled | default false }}
          replicas: {{ .Values.wazuh.dashboard.replicas | default 1 }}
          enable_ssl: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          extraSpec:
            pod:
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
          serviceAccount:
            automountServiceAccountToken: false
          networkPolicy:
            enabled: false
          {{- if .Values.wazuh.dashboard.resources }}
          resources:
            {{- toYaml .Values.wazuh.dashboard.resources | nindent 12 }}
          {{- end }}
        agent:
          enabled: {{ .Values.wazuh.agent.enabled | default true }}
          images:
            repository: {{ .Values.wazuh.agent.images.repository | default "kinseii/wazuh-agent" | quote }}
            tag: {{ .Values.wazuh.agent.images.tag | default "latest" | quote }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - DAC_READ_SEARCH
                - FOWNER
                - FSETID
                - KILL
                - SETGID
                - SETUID
                - SYS_CHROOT
            seccompProfile:
              type: RuntimeDefault
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault
          serviceAccount:
            automountServiceAccountToken: false
          volumes:
            - name: sys
              hostPath:
                path: /sys
            - name: proc
              hostPath:
                path: /proc
            - name: etc
              hostPath:
                path: /etc
            - name: boot
              hostPath:
                path: /boot
            - name: usr
              hostPath:
                path: /usr
            - name: modules
              hostPath:
                path: /lib/modules
            - name: log
              hostPath:
                path: /var/log
          volumeMounts:
            - mountPath: /host/sys
              name: sys
              readOnly: true
            - mountPath: /host/proc
              name: proc
              readOnly: true
            - mountPath: /host/etc
              name: etc
              readOnly: true
            - mountPath: /host/boot
              name: boot
              readOnly: true
            - mountPath: /host/usr
              name: usr
              readOnly: true
            - mountPath: /host/lib/modules
              name: modules
              readOnly: true
            - mountPath: /host/var/log
              name: log
              readOnly: true
        {{- if .Values.wazuh.extraValues }}
        {{- toYaml .Values.wazuh.extraValues | nindent 8 }}
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.wazuh.namespace | default "wazuh" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        zarf.dev/agent: "ignore"
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
{{- if .Values.wazuh.dashboard.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh-gateway
  namespace: {{ .Values.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/kevinpthorne/libraryofalexandria.git
    targetRevision: HEAD
    path: pkgs/gateway-helm
    helm:
      valuesObject:
        endpoints:
          - name: wazuh
            createGateway: false
            gatewayName: local-gateway
            gatewayNamespace: kube-system
            hostnames:
              - "wazuh.{{ $cluster.name | default "k" }}.loa.internal"
              - "wazuh.loa.internal"
            ports:
              - name: https
                port: 443
                protocol: TLS
                targetPort: 5601
                targetService: wazuh-dashboard
                tls:
                  mode: Passthrough
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.wazuh.namespace | default "wazuh" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
{{- end }}
