name: Publish Sipcord Bridge Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            accept-flake-config = true

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push amd64
      - name: Build sipcord-bridge-image (amd64)
        run: |
          nix build .#packages.x86_64-linux.sipcord-bridge-image -o result-amd64

      - name: Load and push amd64 image
        run: |
          docker load -i result-amd64
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/sipcord-bridge"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          TAG_SHA="${IMAGE_NAME}:sha-${SHORT_SHA}-amd64"
          docker tag sipcord-bridge:latest "${TAG_SHA}"
          docker push "${TAG_SHA}"
          
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            TAG_LATEST="${IMAGE_NAME}:latest-amd64"
            docker tag sipcord-bridge:latest "${TAG_LATEST}"
            docker push "${TAG_LATEST}"
          fi
          docker rmi sipcord-bridge:latest

      # Build & Push arm64
      - name: Build sipcord-bridge-image (arm64)
        run: |
          nix build .#packages.aarch64-linux.sipcord-bridge-image -o result-arm64

      - name: Load and push arm64 image
        run: |
          docker load -i result-arm64
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/sipcord-bridge"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          TAG_SHA="${IMAGE_NAME}:sha-${SHORT_SHA}-arm64"
          docker tag sipcord-bridge:latest "${TAG_SHA}"
          docker push "${TAG_SHA}"
          
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            TAG_LATEST="${IMAGE_NAME}:latest-arm64"
            docker tag sipcord-bridge:latest "${TAG_LATEST}"
            docker push "${TAG_LATEST}"
          fi
          docker rmi sipcord-bridge:latest

      # Multi-Arch Manifest
      - name: Create and push multi-arch manifest
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER}/sipcord-bridge"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          export DOCKER_CLI_EXPERIMENTAL=enabled
          
          docker manifest create "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            --amend "${IMAGE_NAME}:sha-${SHORT_SHA}-amd64" \
            --amend "${IMAGE_NAME}:sha-${SHORT_SHA}-arm64"
          docker manifest push "${IMAGE_NAME}:sha-${SHORT_SHA}"
          
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            docker manifest create "${IMAGE_NAME}:latest" \
              --amend "${IMAGE_NAME}:latest-amd64" \
              --amend "${IMAGE_NAME}:latest-arm64"
            docker manifest push "${IMAGE_NAME}:latest"
          fi
